name: Claude code review

# Runs an automated Claude review on every PR against this repo, and lets a maintainer or
# reviewer trigger a follow-up turn (including autofixes) by @-mentioning Claude in a PR or
# issue comment. This is the automation gap flagged in the panscriptum-status-update session on
# 2026-08-23: src/overwatch.py's in-project auditor is deliberately report-only (see its own
# module docstring), and this repo had no GitHub-side review wiring at all before this file.
#
# Requires an ANTHROPIC_API_KEY repository secret (Settings -> Secrets and variables -> Actions).
# Without it this workflow will run and fail at the "Run Claude" step rather than silently
# no-op — check the Actions tab if PRs stop getting reviewed.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  claude-review:
    # Skip runs triggered by a comment that doesn't mention Claude, so ordinary PR discussion
    # doesn't burn a job for nothing.
    if: >-
      github.event_name == 'pull_request' ||
      contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # On a fresh PR: review for correctness bugs and reuse/simplification/efficiency
          # issues, same shape as this project's own /code-review skill, and push small
          # high-confidence fixes directly rather than only commenting. On an @claude mention:
          # follow whatever the comment asks.
          prompt: |
            ${{ github.event_name == 'pull_request' &&
                'Review this PR''s diff for correctness bugs and reuse/simplification/efficiency
                 issues. For any small, high-confidence fix (an off-by-one, a mislabeled return
                 field, an unbounded loop that should be closed-form, dead code) push the fix
                 directly to the PR branch and explain what changed and why in a PR comment.
                 For anything larger or more ambiguous, leave a PR comment describing the issue
                 and a proposed fix instead of pushing. Do not touch handoff/HANDOFF.md''s
                 pipeline-status content, docs/state.json, or state/ -- those are written by the
                 project''s own tooling and this checkout is a published export copy with no
                 data/ directory, so pipeline code here should not be run.' ||
                'Follow the instructions in the comment that mentioned you.' }}
          claude_args: |
            --allowed-tools "Bash(git diff:*),Bash(git log:*),Bash(python3 -m py_compile:*)"
